name: Daily content

# Writes the next day's reading in the evening (Turkey time), taking the
# categories in turn, and commits it to content/. GitHub often starts scheduled
# runs hours late, so there are backup runs; only the first one writes (the
# script skips a day that already has its reading). The app shows the reading
# from its date on, in time for the 07:30 reminder.
# Needs the GEMINI_API_KEY repository secret.
on:
  schedule:
    - cron: "17 15 * * *" # 18:17 Turkey
    - cron: "17 19 * * *" # 22:17 Turkey (backup)
    - cron: "17 1 * * *" # 04:17 Turkey (backup)
  # Also run once when the generator itself changes (the daily commits only
  # touch content/index.json and content/decks/, so this never loops)
  push:
    branches: [main]
    paths: ["content/generate.mjs", "content/prompt.mjs", ".github/workflows/daily-content.yml"]
  workflow_dispatch:
    inputs:
      decks:
        description: "How many readings to write"
        default: "1"
      category:
        description: "Only this category id (optional, e.g. finans)"
        default: ""
      force:
        description: "Write even if the day already has its reading"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-content

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Write new decks
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DECKS_PER_RUN: ${{ inputs.decks || '1' }}
          CATEGORY: ${{ inputs.category }}
          FORCE: ${{ inputs.force && '1' || '' }}
        run: node content/generate.mjs

      - name: Commit
        run: |
          git config user.name "scrollabus-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content
          git diff --cached --quiet && exit 0
          git commit -m "Add daily reading decks"
          git push
