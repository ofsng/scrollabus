name: Daily content

# Writes one new reading every morning (Turkey time), taking the categories in
# turn, and commits it to content/. The app downloads it on its next launch.
# Needs the GEMINI_API_KEY repository secret.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      decks:
        description: "How many readings to write"
        default: "1"
      category:
        description: "Only this category id (optional, e.g. finans)"
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-content

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Write new decks
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DECKS_PER_RUN: ${{ inputs.decks || '1' }}
          CATEGORY: ${{ inputs.category }}
        run: node content/generate.mjs

      - name: Commit
        run: |
          git config user.name "scrollabus-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content
          git diff --cached --quiet && exit 0
          git commit -m "Add daily reading decks"
          git push
